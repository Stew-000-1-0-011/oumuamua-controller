[package]
name = "app"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
proto = { path = "../proto" }
link = { path = "../link" }
term = { path = "../term" }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-femtovg"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile = "3"

[package.metadata.android]
package = "dev.oumuamua.controller"
build_targets = ["aarch64-linux-android"]
uses_permission = [
  { name = "android.permission.INTERNET" },
  { name = "android.permission.ACCESS_WIFI_STATE" },
  { name = "android.permission.CHANGE_WIFI_MULTICAST_STATE" },
]

[package.metadata.android.signing.release]
path = "/root/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "oumuamua"

[package.metadata.android.application.activity]
orientation = "landscape"
